org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Where the app reads its cards from: the news engine's published feed.
# After GitHub Pages is set up this is https://<github-user>.github.io/<repo>/feed.json
pulsecast.feedUrl=https://seben-source.github.io/pulsecast/feed.json

# AdMob IDs. These are Google's official TEST IDs: they show test ads and are
# safe while developing. Replace both with your own before publishing.
pulsecast.admobAppId=ca-app-pub-3940256099942544~3347511713
pulsecast.nativeAdUnitId=ca-app-pub-3940256099942544/2247696110
